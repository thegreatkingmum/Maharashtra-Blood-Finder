<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
Find Blood | Maharashtra Blood Finder
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}"
>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

.finder-card {
border: 0;
border-radius: 18px;
}

.blood-card {
border: 1px solid #e5e7eb;
border-radius: 16px;
transition: 0.2s ease;
}

.blood-card:hover {
transform: translateY(-2px);
box-shadow:
0 10px 25px
rgba(0, 0, 0, 0.08);
}

.blood-group-chips {
display: flex;
flex-wrap: wrap;
gap: 10px;
}

.blood-group-chip {
min-width: 58px;
padding: 10px 16px;
border-radius: 999px;
border: 1px solid #dfe3e8;
background: #ffffff;
color: #2b2e34;
font-weight: 700;
line-height: 1;
cursor: pointer;

transition:
transform 0.18s ease,
background 0.18s ease,
color 0.18s ease,
border-color 0.18s ease,
box-shadow 0.18s ease;
}

.blood-group-chip:hover {
transform: translateY(-1px);
border-color: #b4232f;
color: #b4232f;
}

.blood-group-chip.active {
background: #b4232f;
border-color: #b4232f;
color: #ffffff;
box-shadow:
0 8px 20px
rgba(180, 35, 47, 0.18);
}

@media (max-width: 767.98px) {

.blood-group-chips {
gap: 8px;
}

.blood-group-chip {
min-width: 52px;
padding: 9px 13px;
}

}

</style>

</head>

<body>

<div class="container-fluid py-4">

<div class="container">

<div class="mb-4">

<h1 class="fw-bold">
Find Blood
</h1>

<p class="text-muted">
Search blood availability across Maharashtra
and receive ranked blood-bank results when needed.
</p>

</div>


<div class="card finder-card shadow-sm mb-5">

<div class="card-body p-4">


<!-- ==================================================
     LOCATION SEARCH
=================================================== -->

<div class="row g-3">


<!-- DISTRICT -->

<div class="col-lg-4">

<label
for="districtSelect"
class="form-label fw-semibold"
>
District
</label>

<select
id="districtSelect"
class="form-select"
>

<option value="">
All districts
</option>

</select>

</div>


<!-- CITY -->

<div
id="cityField"
class="col-lg-4"
>

<label
for="citySelect"
class="form-label fw-semibold"
>
City
</label>

<select
id="citySelect"
class="form-select"
disabled
>

<option value="">
Select district first
</option>

</select>

</div>


<!-- AREA -->

<div class="col-lg-4">

<label
for="areaInput"
class="form-label fw-semibold"
>
Area
</label>

<input
type="text"
class="form-control"
id="areaInput"
placeholder="Select district and city first"
disabled
>

</div>

</div>


<!-- ==================================================
     BLOOD GROUP + UNITS + SEARCH
=================================================== -->

<div class="row g-3 mt-1 align-items-end">


<!-- BLOOD GROUP CHIPS -->

<div class="col-lg-8">

<label
class="form-label fw-semibold d-block"
>
Blood Group
</label>

<input
type="hidden"
id="bloodGroupSelect"
value="A+"
>

<div
id="bloodGroupChips"
class="blood-group-chips"
role="group"
aria-label="Blood group"
>

<button
type="button"
class="blood-group-chip active"
data-blood-group="A+"
aria-pressed="true"
>
A+
</button>

<button
type="button"
class="blood-group-chip"
data-blood-group="A-"
aria-pressed="false"
>
A−
</button>

<button
type="button"
class="blood-group-chip"
data-blood-group="B+"
aria-pressed="false"
>
B+
</button>

<button
type="button"
class="blood-group-chip"
data-blood-group="B-"
aria-pressed="false"
>
B−
</button>

<button
type="button"
class="blood-group-chip"
data-blood-group="O+"
aria-pressed="false"
>
O+
</button>

<button
type="button"
class="blood-group-chip"
data-blood-group="O-"
aria-pressed="false"
>
O−
</button>

<button
type="button"
class="blood-group-chip"
data-blood-group="AB+"
aria-pressed="false"
>
AB+
</button>

<button
type="button"
class="blood-group-chip"
data-blood-group="AB-"
aria-pressed="false"
>
AB−
</button>

</div>

</div>


<!-- UNITS -->

<div class="col-lg-2">

<label
for="requiredUnits"
class="form-label fw-semibold"
>
Units
</label>

<input
type="number"
id="requiredUnits"
class="form-control"
value="1"
min="1"
>

</div>


<!-- SEARCH -->

<div class="col-lg-2 d-flex align-items-end">

<button
class="btn btn-danger w-100"
id="searchButton"
type="button"
>
Find Blood
</button>

</div>

</div>

</div>

</div>


<div
id="searchStatus"
class="mb-4"
></div>


<div
id="resultsContainer"
class="row g-4"
></div>


<script>

/* =========================================================
   HELPERS
========================================================= */

async function getJSON(
    url
) {

    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            `${url} → HTTP ${response.status}`
        );

    }

    return await response.json();

}


function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================================
   LOCATION STATE
========================================================= */

let locationHierarchy = [];

let allDistricts = [];

let allCities = [];

let citylessDistricts = [
    "Mumbai",
    "Mumbai Suburban"
];

let validAreasByDistrict = {};


/* =========================================================
   LOAD LOCATIONS
========================================================= */

async function loadLocations() {

    const data =
        await getJSON(
            "/api/locations"
        );


    locationHierarchy =
        Array.isArray(
            data.hierarchy
        )
            ? data.hierarchy
            : [];


    allDistricts =
        Array.isArray(
            data.districts
        )
            ? data.districts
            : [];


    allCities =
        Array.isArray(
            data.cities
        )
            ? data.cities
            : [];


    validAreasByDistrict =
        (
            data.valid_areas_by_district
            &&
            typeof data.valid_areas_by_district
                === "object"
        )
            ?
            data.valid_areas_by_district
            :
            {};


    if (
        Array.isArray(
            data.cityless_districts
        )
        &&
        data.cityless_districts.length
    ) {

        citylessDistricts =
            data.cityless_districts;

    }


    populateDistricts();

    resetCityControl();

}


/* =========================================================
   LOCATION HELPERS
========================================================= */

function normalizeLocationText(
    value
) {

    return String(
        value ?? ""
    )
    .trim()
    .toLowerCase();

}


function getCanonicalSpecialArea(
    district,
    area
) {

    const targetDistrict =
        normalizeLocationText(
            district
        );

    const isMumbaiSpecial =
        (
            targetDistrict
            ===
            "mumbai"
        )
        ||
        (
            targetDistrict
            ===
            "mumbai suburban"
        );


    if (
        !isMumbaiSpecial
        ||
        !area
    ) {

        return null;

    }


    const catalogKey =
        targetDistrict === "mumbai"
            ?
            "Mumbai"
            :
            "Mumbai Suburban";


    const areas =
        validAreasByDistrict[
            catalogKey
        ]
        ||
        [];


    const targetArea =
        normalizeLocationText(
            area
        );


    const match =
        areas.find(
            item =>
                normalizeLocationText(
                    item
                )
                ===
                targetArea
        );


    return match || null;

}


function isSpecialMumbaiDistrict(
    district
) {

    const normalized =
        normalizeLocationText(
            district
        );

    return (
        normalized === "mumbai"
        ||
        normalized === "mumbai suburban"
    );

}


function populateDistricts() {

    const districtSelect =
        document.getElementById(
            "districtSelect"
        );


    districtSelect.innerHTML =
        `
        <option value="">
            All districts
        </option>
        `;


    allDistricts
        .slice()
        .sort(
            (
                a,
                b
            ) =>
                String(a).localeCompare(
                    String(b)
                )
        )
        .forEach(
            district => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    district;


                option.textContent =
                    district;


                districtSelect.appendChild(
                    option
                );

            }
        );

}


function isCitylessDistrict(
    district
) {

    const target =
        normalizeLocationText(
            district
        );


    return citylessDistricts.some(
        value =>
            normalizeLocationText(
                value
            )
            ===
            target
    );

}


function findDistrictRecord(
    district
) {

    const target =
        normalizeLocationText(
            district
        );


    return locationHierarchy.find(
        item =>
            normalizeLocationText(
                item.district
            )
            ===
            target
    );

}


function getCitiesForDistrict(
    district
) {

    if (
        !district
        ||
        isCitylessDistrict(
            district
        )
    ) {

        return [];

    }


    const record =
        findDistrictRecord(
            district
        );


    if (
        !record
        ||
        !Array.isArray(
            record.cities
        )
    ) {

        return [];

    }


    return record.cities
        .map(
            item =>
                item.city
        )
        .filter(Boolean)
        .sort(
            (
                a,
                b
            ) =>
                String(a).localeCompare(
                    String(b)
                )
        );

}


function resetAreaInput(
    enabled,
    placeholder
) {

    const areaInput =
        document.getElementById(
            "areaInput"
        );


    if (!areaInput) {

        return;

    }


    areaInput.value =
        "";


    areaInput.disabled =
        !enabled;


    areaInput.placeholder =
        placeholder;

}


function populateCities(
    district
) {

    const citySelect =
        document.getElementById(
            "citySelect"
        );

    const cityField =
        document.getElementById(
            "cityField"
        );


    if (
        isCitylessDistrict(
            district
        )
    ) {

        cityField.style.display =
            "none";

        citySelect.innerHTML =
            `
            <option value="">
                Not applicable
            </option>
            `;

        citySelect.value =
            "";

        citySelect.disabled =
            true;


        resetAreaInput(
            true,
            "Type a valid area"
        );

        return;

    }


    cityField.style.display =
        "";

    citySelect.innerHTML =
        `
        <option value="">
            Select city
        </option>
        `;


    citySelect.value =
        "";

    citySelect.disabled =
        true;


    const cities =
        getCitiesForDistrict(
            district
        );


    cities.forEach(
        city => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                city;


            option.textContent =
                city;


            citySelect.appendChild(
                option
            );

        }
    );


    if (cities.length) {

        citySelect.disabled =
            false;

    }


    resetAreaInput(
        false,
        "Select a city first"
    );

}


function resetCityControl() {

    const cityField =
        document.getElementById(
            "cityField"
        );

    const citySelect =
        document.getElementById(
            "citySelect"
        );


    cityField.style.display =
        "";

    citySelect.innerHTML =
        `
        <option value="">
            Select district first
        </option>
        `;


    citySelect.value =
        "";


    citySelect.disabled =
        true;


    resetAreaInput(
        false,
        "Select district and city first"
    );

}


function handleDistrictChange() {

    const district =
        document
            .getElementById(
                "districtSelect"
            )
            .value;


    const citySelect =
        document.getElementById(
            "citySelect"
        );


    citySelect.value =
        "";


    if (!district) {

        resetCityControl();

        return;

    }


    populateCities(
        district
    );

}


function handleCityChange() {

    const district =
        document
            .getElementById(
                "districtSelect"
            )
            .value;


    const city =
        document
            .getElementById(
                "citySelect"
            )
            .value;


    if (
        isCitylessDistrict(
            district
        )
    ) {

        resetAreaInput(
            true,
            "Type a valid area"
        );

        return;

    }


    resetAreaInput(
        Boolean(city),
        city
            ? "Type an area"
            : "Select a city first"
    );

}


/* =========================================================
   BLOOD GROUP CHIPS
========================================================= */

function initializeBloodGroupChips() {

    const hidden =
        document.getElementById(
            "bloodGroupSelect"
        );


    const chips =
        document.querySelectorAll(
            ".blood-group-chip"
        );


    chips.forEach(
        chip => {

            chip.addEventListener(
                "click",
                () => {

                    const group =
                        chip.dataset
                            .bloodGroup;


                    hidden.value =
                        group;


                    chips.forEach(
                        item => {

                            const active =
                                item ===
                                chip;


                            item.classList.toggle(
                                "active",
                                active
                            );


                            item.setAttribute(
                                "aria-pressed",
                                active
                                    ? "true"
                                    : "false"
                            );

                        }
                    );

                }
            );

        }
    );

}


/* =========================================================
   SEARCH BLOOD
========================================================= */

async function searchBlood() {

    const areaInput =
        document.getElementById(
            "areaInput"
        );


    const rawArea =
        areaInput
            .value
            .trim();


    const district =
        document
            .getElementById(
                "districtSelect"
            )
            .value;


    const city =
        document
            .getElementById(
                "citySelect"
            )
            .value;


    const bloodGroup =
        document
            .getElementById(
                "bloodGroupSelect"
            )
            .value;


    const units =
        document
            .getElementById(
                "requiredUnits"
            )
            .value;


    let area =
        rawArea;


    const status =
        document.getElementById(
            "searchStatus"
        );


    const container =
        document.getElementById(
            "resultsContainer"
        );


    // Mumbai City and Mumbai Suburban use a curated
    // locality catalog. The area remains a plain text
    // field with no dropdown or autocomplete.
    if (
        isSpecialMumbaiDistrict(
            district
        )
        &&
        rawArea
    ) {

        const canonicalArea =
            getCanonicalSpecialArea(
                district,
                rawArea
            );


        if (!canonicalArea) {

            status.innerHTML =
                `
                <div class="alert alert-warning">

                    Please enter a valid Mumbai
                    City / Mumbai Suburban area.

                    <div class="small mt-2">
                        Examples:
                        Worli, Matunga, Lalbaug,
                        Dadar, Mulund.
                    </div>

                </div>
                `;


            container.innerHTML =
                "";


            areaInput.focus();


            return;

        }


        area =
            canonicalArea;


        areaInput.value =
            canonicalArea;

    }


    const params =
        new URLSearchParams();


    if (area) {

        params.set(
            "area",
            area
        );

    }


    if (city) {

        params.set(
            "city",
            city
        );

    }


    if (district) {

        params.set(
            "district",
            district
        );

    }


    params.set(
        "blood_group",
        bloodGroup
    );


    params.set(
        "required_units",
        units
    );


    container.innerHTML =
        "";


    status.innerHTML =
        `
        <div class="alert alert-info">
            Searching current blood availability...
        </div>
        `;


    try {

        const data =
            await getJSON(
                `/api/find-blood?${params.toString()}`
            );


        const results =
            data.results
            ||
            [];


        if (!results.length) {

            status.innerHTML =
                `
                <div class="alert alert-warning">
                    No blood bank currently satisfies
                    the requested stock requirement.
                    Try another area, city or district.
                </div>
                `;

            return;

        }


        if (
            data.area_fallback
        ) {

            const selectedArea =
                escapeHTML(
                    data.selected_area
                    ||
                    area
                );


            const nearestBank =
                escapeHTML(
                    results[0].blood_bank_name
                );


            const distance =
                Number(
                    results[0].distance_km
                    ??
                    0
                );


            const distanceText =
                Number.isFinite(
                    distance
                )
                    ?
                    `${distance.toFixed(1)} km`
                    :
                    "nearby";


            if (
                data.fallback_stock_available
                ===
                false
            ) {

                status.innerHTML =
                    `
                    <div class="alert alert-warning">

                        No blood bank is registered in
                        <strong>
                            ${selectedArea}
                        </strong>.

                        Showing the closest registered
                        blood bank:

                        <strong>
                            ${nearestBank}
                        </strong>

                        <span>
                            (${distanceText})
                        </span>,

                        but it currently does not have
                        enough ${escapeHTML(
                            bloodGroup
                        )} units.

                    </div>
                    `;

            }

            else {

                status.innerHTML =
                    `
                    <div class="alert alert-light border">

                        No blood bank is registered in
                        <strong>
                            ${selectedArea}
                        </strong>.

                        Showing the closest registered
                        blood bank:

                        <strong>
                            ${nearestBank}
                        </strong>

                        <span>
                            (${distanceText})
                        </span>

                        with the requested
                        <strong>
                            ${escapeHTML(
                                bloodGroup
                            )}
                        </strong>
                        stock.

                    </div>
                    `;

            }

        }

        else {

            status.innerHTML =
                `
                <div class="alert alert-light border">

                    Showing

                    <strong>
                        ${results.length}
                    </strong>

                    blood banks for

                    <strong>
                        ${escapeHTML(
                            bloodGroup
                        )}
                    </strong>

                    at

                    <strong>
                        ${escapeHTML(
                            data.selected_area
                            ||
                            data.search_level
                        )}
                    </strong>

                    level.

                </div>
                `;

        }


        container.innerHTML =
            results
                .map(
                    bank =>
                        createBankCard(
                            bank,
                            bloodGroup
                        )
                )
                .join("");

    }

    catch (
        error
    ) {

        console.error(
            error
        );


        if (
            error
            &&
            String(
                error.message
            ).includes(
                "400"
            )
        ) {

            status.innerHTML =
                `
                <div class="alert alert-warning">

                    Please enter a valid area
                    for the selected Mumbai district.

                </div>
                `;

        }

        else {

            status.innerHTML =
                `
                <div class="alert alert-danger">

                    Search failed.

                    ${escapeHTML(
                        error.message
                    )}

                </div>
                `;

        }

    }

}


/* =========================================================
   INITIAL PAGE EVENTS
========================================================= */

document
    .getElementById(
        "districtSelect"
    )
    .addEventListener(
        "change",
        handleDistrictChange
    );


document
    .getElementById(
        "citySelect"
    )
    .addEventListener(
        "change",
        handleCityChange
    );


document
    .getElementById(
        "searchButton"
    )
    .addEventListener(
        "click",
        searchBlood
    );


document
    .getElementById(
        "areaInput"
    )
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                searchBlood();

            }

        }
    );


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        initializeBloodGroupChips();


        try {

            await loadLocations();

        }

        catch (
            error
        ) {

            console.error(
                "Locations:",
                error
            );


            document.getElementById(
                "searchStatus"
            ).innerHTML =
                `
                <div class="alert alert-danger">
                    Failed to load location data.
                    ${escapeHTML(
                        error.message
                    )}
                </div>
                `;

        }

    }
);


/* =========================================================
   BLOOD BANK CARD
========================================================= */

function createBankCard(
    bank,
    bloodGroup
) {

    let mapsLink =
        "";


    if (
        bank.latitude !== null
        &&
        bank.latitude !== undefined
        &&
        bank.longitude !== null
        &&
        bank.longitude !== undefined
    ) {

        mapsLink =
            `
            <a
                class="btn btn-outline-dark btn-sm"
                target="_blank"
                rel="noopener"
                href="https://www.google.com/maps?q=${bank.latitude},${bank.longitude}"
            >
                Google Maps
            </a>
            `;

    }


    const phone =
        bank.contact
        ||
        "";


    const fallbackInfo =
        bank.is_area_fallback
            ?
            `
            <div
                class="small text-danger fw-semibold mb-2"
            >

                Closest blood bank

                ${
                    Number.isFinite(
                        Number(
                            bank.distance_km
                        )
                    )
                        ?
                        `• ${
                            Number(
                                bank.distance_km
                            ).toFixed(1)
                        } km away`
                        :
                        ""
                }

            </div>
            `
            :
            "";


    return `

        <div class="col-lg-6">

            <div class="card blood-card h-100">

                <div class="card-body">

                    <div
                        class="d-flex justify-content-between"
                    >

                        <div>

                            ${fallbackInfo}

                            <h5 class="fw-bold mb-1">

                                ${
                                    escapeHTML(
                                        bank.blood_bank_name
                                    )
                                }

                            </h5>

                            <small class="text-muted">

                                ${
                                    escapeHTML(
                                        bank.area
                                    )
                                },

                                ${
                                    escapeHTML(
                                        bank.city
                                    )
                                },

                                ${
                                    escapeHTML(
                                        bank.district
                                    )
                                }

                            </small>

                        </div>


                        <div class="text-end">

                            <div
                                class="stock-number"
                            >

                                ${
                                    Number(
                                        bank.stock
                                    ).toFixed(0)
                                }

                            </div>

                            <small class="text-muted">

                                ${escapeHTML(
                                    bloodGroup
                                )}
                                units

                            </small>

                        </div>

                    </div>


                    <hr>


                    <div
                        class="d-flex flex-wrap gap-2"
                    >

                        ${
                            phone
                            ?

                            `
                            <a
                                class="btn btn-outline-danger btn-sm"
                                href="tel:${escapeHTML(phone)}"
                            >
                                Call
                            </a>
                            `

                            :

                            ""
                        }


                        ${mapsLink}

                    </div>

                </div>
